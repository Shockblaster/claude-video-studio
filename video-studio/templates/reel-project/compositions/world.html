        const ka = pop(t, C("tenk") - 0.05, 14, 0.6) * r; setOp("c4-amt", clamp(ka * 2)); tf("c4-amt", `scale(${ka})`);
        const tagB = pop(t, C("p80") - 0.1, 12, 0.5) * r; setOp("c4-tagB", clamp(tagB * 2)); tf("c4-tagB", `translateY(${(1 - tagB) * -80}px) rotate(${(1 - tagB) * 14}deg)`);
        for (let i = 0; i < 5; i++) {
          const ta = C("at") + 0.85 + i * 0.2, tb = C("same") + 0.8 + i * 0.2;
          const da = eout(seg(t, ta, ta + 0.28)) * r, db = eout(seg(t, tb, tb + 0.28)) * r;
          const ea = $("c4-a" + i), eb = $("c4-b" + i);
          ea.style.top = lerp(290, BLK(i), da) + "px"; ea.style.opacity = i < 4 ? clamp(da * 4) : 0;
          eb.style.top = lerp(290, BLK(i), db) + "px"; eb.style.opacity = clamp(db * 4);
        }
        const la = pop(t, C("u100") - 0.02, 14, 0.55) * r; setOp("c4-lA", clamp(la * 2)); tf("c4-lA", `scale(${la})`);
        Object.assign($("c4-lA").style, { left: "164px", top: "652px" });
        const lb = pop(t, C("u125") - 0.02, 14, 0.55) * r; setOp("c4-lB", clamp(lb * 2)); tf("c4-lB", `scale(${lb})`);
        Object.assign($("c4-lB").style, { left: "624px", top: "652px" });
        const sw = t - (C("sale") - 0.3); const sale = sw > 0 ? r : 0;
        setOp("c4-sale", sale); tf("c4-sale", `rotate(${sw > 0 ? 28 * Math.exp(-3 * sw) * Math.cos(9 * sw) : 0}deg)`);
        setOp("c4-saleTxt", seg(t, C("sale"), C("sale") + 0.3) * r);
        // S5
        for (let i = 0; i < 6; i++) { const tt = i === 0 ? C("six") : TT[i - 1]; const k = seg(t, tt, tt + 0.25) * r;
          $("c5-t" + i).style.background = k > 0.5 ? "#f1efea" : "#eef3fb"; $("c5-u" + i).style.color = k > 0.5 ? "#a49f95" : "#00357a";
          $("c5-x" + i).style.width = 230 * eout(k) + "px"; }
        const kt = pop(t, C("u750") - 0.02, 16, 0.5) * r; setOp("c5-total", clamp(kt * 2)); tf("c5-total", `scale(${kt})`);
        // S6
        $("c6-p").textContent = t >= C("b100") - 0.05 && r > 0.5 ? "Rs 100" : "Rs 80";
        $("c6-p").style.color = t >= C("b100") - 0.05 && r > 0.5 ? "#0e9a49" : "#b5473a";
        setOp("c6-eq", seg(t, C("worth") - 0.4, C("worth")) * r);
        const kv = seg(t, C("r75k") - 0.1, C("r75k") + 0.9) * r; setOp("c6-val", clamp(kv * 4));
        $("c6-val").textContent = "Rs " + (Math.round(75000 * eout(kv) / 100) * 100).toLocaleString("en-IN");
        setOp("c6-l1", seg(t, C("r75k"), C("r75k") + 0.3) * r); $("c6-b1").style.width = 780 * eout(seg(t, C("r75k"), C("r75k") + 0.7)) * r + "px";
        setOp("c6-l2", seg(t, C("r60k") - 0.1, C("r60k") + 0.2) * r); $("c6-b2").style.width = 624 * eout(seg(t, C("r60k"), C("r60k") + 0.6)) * r + "px";
        const kg = pop(t, C("heldback"), 14, 0.55) * r; setOp("c6-gap", clamp(kg * 2)); tf("c6-gap", `scale(${kg})`);
        $("c6-mk").style.backgroundSize = `${100 * eio(seg(t, C("heldback") + 0.25, C("heldback") + 0.7)) * r}% 34%`;
        // S7
        const u20 = ride20(t) * r;
        $("c7-line").setAttribute("d", pathTo(S20, Math.max(0.0001, u20))); $("c7-area").setAttribute("d", areaTo(S20, Math.max(0.0001, u20), BOX7[3]));
        setOp("c7-old", seg(t, R20.t0, R20.t0 + 0.4) * r); setOp("c7-oldl", seg(t, R20.t0 + 0.1, R20.t0 + 0.5) * r);
        const k40 = pop(t, C("pct40"), 15, 0.55) * r; setOp("c7-badge", clamp(k40 * 2)); tf("c7-badge", `scale(${k40})`);
        const kbk = pop(t, C("oldhigh"), 15, 0.55) * r; setOp("c7-back", clamp(kbk * 2)); tf("c7-back", `scale(${kbk})`);
        $("c7-old").setAttribute("stroke", t > C("oldhigh") && t < C("oldhigh") + 0.5 && r > 0.5 ? "#0e9a49" : "#608396");
        for (let j = 0; j < 3; j++) { const kd = pop(t, C("kept") + 0.2 + j * 0.25, 16, 0.5) * r; setOp("c7-d" + j, clamp(kd * 2));
          $("c7-d" + j).setAttribute("r", 14 * kd + 4 * Math.max(0, Math.sin((t - C("lowest")) * 7)) * seg(t, C("lowest"), C("lowest") + 0.2) * r); }
        setOp("c7-buys", seg(t, C("lowest") - 0.1, C("lowest") + 0.3) * r);
        // S8
        const TK = [C("one"), C("two"), C("falling")];
        for (let i = 0; i < 3; i++) { const k = seg(t, TK[i] + 0.02, TK[i] + 0.2) * r; const good = i < 2;
          $("c8-b" + i).style.background = k > 0.5 ? (good ? "#0e9a49" : "#b5473a") : "#fff"; $("c8-b" + i).style.borderColor = k > 0.5 ? (good ? "#0e9a49" : "#b5473a") : "#bdb9ac";
          setOp("c8-m" + i, k); tf("c8-m" + i, `scale(${lerp(0.4, 1, pop(t, TK[i] + 0.02, 18, 0.5))})`); }
        $("c8-strike").style.width = 480 * eout(seg(t, C("noreason") - 0.15, C("noreason") + 0.3)) * r + "px";
        setOp("c8-no", seg(t, C("noreason"), C("noreason") + 0.3) * r);
        // S9 (the coin is the knob)
        const kp = (t >= SLIDE.t0 ? spring(t - SLIDE.t0, 11, 0.7) : 0) * r;
        $("c9-fill").style.width = lerp(150, 700, clamp(kp)) + "px"; setOp("c9-fill", clamp(kp * 3) * 0.9);
        setOp("c9-pause", lerp(0.35, 1, clamp(kp))); $("c9-pause").style.color = kp > 0.5 ? "#0e9a49" : "#00357a";
        setOp("c9-cancel", lerp(1, 0.45, clamp(kp)));
        $("c9-strike").style.width = 210 * eout(seg(t, C("cancelling"), C("cancelling") + 0.35)) * r + "px";
        setOp("c9-txt", seg(t, C("pause") + 0.4, C("pause") + 0.8) * r);
        // S10
        const press = Math.sin(Math.PI * seg(t, C("friend") - 0.08, C("friend") + 0.16));
        tf("c10-btn", `scale(${1 - 0.06 * press})`);

        // coin (+ squash on contacts, stretch in flight, halo on the reveal)
        const [x, y, air, sc] = coinAt(t);
        let sx = 1, sy = 1;
        for (const ct of CONTACTS) { const d = t - ct; if (d >= -0.001 && d < 0.18) { const k = Math.sin(Math.PI * d / 0.18); sx = 1 + 0.24 * k; sy = 1 - 0.2 * k; } }
        if (air) { sx *= 0.93; sy *= 1.08; }
        const sink = SINK.map(([a, b]) => seg(t, a, b));
        let op = 1;
        if (t >= SINK[0][0] && t < NEW1) op = 1 - sink[0];
        if (t >= SINK[1][0] && t < NEW2) op = 1 - sink[1];
        let cxw = x, cyw = y + 40 * Math.max(sink[0] * (t < NEW1 ? 1 : 0), sink[1] * (t < NEW2 ? 1 : 0));
        if (t >= NEW1 && t < C("same") - 0.32) { const k = pop(t, NEW1, 16, 0.55); op = clamp(k * 2); sx *= k; sy *= k; cxw = TOPC[0]; cyw = TOPC[1]; }
        if (t >= NEW2 && t < C("stop6") - 0.6) { const k = pop(t, NEW2, 16, 0.55); op = clamp(k * 2); sx *= k; sy *= k; cxw = ON_B[0]; cyw = ON_B[1]; }
        const wob = (t > C("shopping") && t < C("sale")) ? Math.sin((t - C("shopping")) * 18) * 8 : 0;
        const big = 1 + 1.3 * eio(seg(t, LAUNCH.t0 + 0.3, LAUNCH.t0 + 1.3)) * (1 - eio(seg(t, 79.3, DUR)));
        tf("coin", `translate(${cxw}px, ${cyw}px) rotate(${wob}deg) scale(${sx * sc * big}, ${sy * sc * big})`);
        $("coin").style.opacity = op;
        setOp("coin-halo", (big - 1) / 1.3);
        tf("coin-shadow", `translate(${cxw}px, ${(air ? cyw + 46 + 30 : cyw + 40)}px) scale(${air ? 0.6 : 1})`);
        $("coin-shadow").style.opacity = op * (air || t >= LAUNCH.t0 ? 0.0 : 1) * (sc > 1.2 ? 0 : 1);

        // reveal: veil, brand and the compliance card (verbatim), then the dive home
        const disc = seg(t, C("voEnd") + 0.15, C("voEnd") + 0.5) * (1 - seg(t, 79.05, 79.3));
        setOp("w-veil", disc * 1); setOp("w-disc", disc); setOp("w-brand", seg(t, C("voEnd"), C("voEnd") + 0.4) * (1 - seg(t, 79.05, 79.3)));
        tf("w-brand", `translateY(${(1 - eout(seg(t, C("voEnd"), C("voEnd") + 0.45))) * 30}px)`);
      }
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__worldRender = render;
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
