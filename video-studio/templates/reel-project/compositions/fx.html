<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #fx-grain { position: absolute; left: -256px; top: -256px; width: 1592px; height: 2432px; background: url(assets/img/grain.png); background-size: 512px 512px; mix-blend-mode: overlay; opacity: .35; }
  </style>
  <div id="root" data-composition-id="fx" data-width="1080" data-height="1920" data-layout-ignore>
    <div id="fx-grain"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // grain jumps to a new seeded offset every frame
      function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(5), g = document.getElementById("fx-grain"), OFF = [];
      for (let i = 0; i < 80 * 30 + 2; i++) OFF.push([Math.floor(R() * 256), Math.floor(R() * 256)]);
      const st = { f: 0 };
      tl.fromTo(st, { f: 0 }, { f: 80 * 30, duration: 80, ease: "none", onUpdate: () => { const o = OFF[Math.floor(st.f)] || OFF[0]; g.style.transform = `translate(${o[0]}px, ${o[1]}px)`; } }, 0);
      window.__timelines["fx"] = tl;
    })();
  </script>
</template>
